# 仓库 CI：推 main 与所有 PR 时构建、跑单测
#
# 触发：push main、pull_request
# 密钥：无
# 发布：v* 标签流程见 publish.yml

name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        # 固定镜像版本，构建环境不随 ubuntu-latest 迁移
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: 设置 JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            # 海外运行器使用 Gradle 官方发行版地址；仓库内 wrapper 用的是国内镜像
            - name: 切换 Gradle 发行版地址
              run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

            - name: 设置 Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: 构建与单测
              run: ./gradlew build --no-daemon --console=plain
